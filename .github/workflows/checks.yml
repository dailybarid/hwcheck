name: checks

# The privacy scan is the important one here. This tool records machine
# identities by design - serial numbers, BIOS versions, disk models, battery
# data - so its own test output is the easiest thing to leak. Running
# check_clean.py on every push means that cannot be forgotten.
#
# Everything below uses the Python standard library only, so there is nothing
# to install and the job stays fast.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: privacy, catalogs, syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Privacy scan - no machine or personal data
        run: python3 tools/check_clean.py

      - name: Translation catalogs match the source
        run: python3 tools/check_translations.py

      - name: i18n self-test - catalogs load and resolve
        run: python3 tools/selftest.py

      - name: Python syntax
        run: |
          python3 -m compileall -q hwcheck tools
          echo "python syntax OK"

      - name: Shell syntax
        run: |
          for f in build-usb.sh hwcheck/*.sh; do
            bash -n "$f"
            echo "  ok  $f"
          done

      - name: Every check section is wired into the run plan
        # A section can exist but never be added to the plan, in which case it
        # silently never runs. Cheap to assert, easy to forget.
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          src = pathlib.Path("hwcheck/hwcheck.py").read_text(encoding="utf-8")
          tree = ast.parse(src)
          defined = {n.name for n in tree.body
                     if isinstance(n, ast.FunctionDef) and n.name.startswith("sec_")}
          called = {n.id for n in ast.walk(tree)
                    if isinstance(n, ast.Name) and n.id.startswith("sec_")}
          print(f"  sections defined   : {len(defined)}")
          print(f"  sections referenced: {len(called & defined)}")
          missing = sorted(defined - called)
          if missing:
              sys.exit(f"  FAIL defined but never referenced: {missing}")
          if not defined:
              sys.exit("  FAIL no sections found - did the file move?")
          print("  all sections wired into the plan")
          PY
